<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>英語好簡單</title> 
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .status-img { width: 36px; height: 36px; object-fit: contain; margin-bottom: 4px; }
    </style>
</head>
<body class="p-2 md:p-8">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-end mb-4">
            <button onclick="switchStudent()" class="text-sm font-bold text-slate-400 hover:text-red-500 transition">🔄 切換學生 (重置紀錄)</button>
        </div>

        <!-- 功能快捷列 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 mt-2"> 
            <div onclick="window.location.href='quiz.html'" class="bg-white py-3 px-4 rounded-2xl border border-slate-100 cursor-pointer shadow-sm hover:shadow-md transition flex flex-col items-center text-center">
                <div class="text-2xl mb-1">🎮</div>
                <h3 class="font-bold text-slate-800 text-lg">單字測驗</h3>
            </div>
            
            <div onclick="window.location.href='wall.html?v=' + new Date().getTime()" class="bg-white py-3 px-4 rounded-2xl border border-slate-100 cursor-pointer shadow-sm hover:shadow-md transition flex flex-col items-center text-center">
                <div class="text-2xl mb-1">🖼️</div>
                <h3 class="font-bold text-slate-800 text-lg">圖片牆</h3>
            </div>
            
            <div onclick="window.location.href='QA.html'" class="bg-white py-3 px-4 rounded-2xl border border-slate-100 cursor-pointer shadow-sm hover:shadow-md transition flex flex-col items-center text-center">
                <div class="text-2xl mb-1">💬</div>
                <h3 class="font-bold text-slate-800 text-lg">看圖問答</h3>
            </div>

            <div id="game-btn" onclick="checkGameAccess()" class="bg-white py-3 px-4 rounded-2xl border border-slate-100 cursor-pointer shadow-sm hover:shadow-md transition flex flex-col items-center text-center relative">
                <img id="game-status-icon" src="https://img.icons8.com/fluency/48/lock.png" class="status-img">
                <h3 id="game-text" class="font-bold text-slate-400 text-lg">遊戲區</h3>
            </div>
        </div>

        <!-- 拼讀與測驗專區 -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100 mb-4">
            <h2 class="text-xl font-bold mb-4 text-slate-700">🔤 字母拼讀</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-center">
                <button onclick="window.location.href='cvc.html'" class="py-3 bg-sky-50 rounded-xl border border-sky-100 font-bold text-sky-600 text-base hover:bg-sky-100 active:scale-95 transition">短母音拼讀</button>
                <button onclick="window.location.href='longV.html'" class="py-3 bg-sky-50 rounded-xl border border-sky-100 font-bold text-sky-600 text-base hover:bg-sky-100 active:scale-95 transition">長母音拼讀</button>
                <button onclick="window.location.href='CC.html'" class="py-3 bg-sky-50 rounded-xl border border-sky-100 font-bold text-sky-600 text-base hover:bg-sky-100 active:scale-95 transition">子音組拼讀</button>
                <button onclick="window.location.href='PhonicsTest.html'" class="py-3 bg-amber-50 rounded-xl border border-amber-100 font-bold text-amber-600 text-base hover:bg-amber-100 active:scale-95 transition">拼讀測驗</button>
            </div>
        </div>

        <!-- 單字庫區塊 -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
            <h2 class="text-xl font-bold mb-4 text-slate-700">📚 單字庫</h2>
            <div class="grid grid-cols-2 gap-2 mb-2 text-center">
                <button onclick="loadPreview('elementary')" class="py-3 bg-slate-50 rounded-xl border border-slate-100 font-bold text-green-600 text-lg hover:bg-green-50 active:scale-95 transition">國小基礎</button>
                <button onclick="loadPreview('junior')" class="py-3 bg-slate-50 rounded-xl border border-slate-100 font-bold text-blue-600 text-lg hover:bg-blue-50 active:scale-95 transition">國中必備</button>
                <button onclick="window.location.href='verbs.html'" class="py-3 bg-slate-50 rounded-xl border border-slate-100 font-bold text-orange-600 text-lg hover:bg-orange-50 active:scale-95 transition">動詞變化</button>
                <button onclick="loadPreview('senior')" class="py-3 bg-slate-50 rounded-xl border border-slate-100 font-bold text-purple-600 text-lg hover:bg-purple-50 active:scale-95 transition">高中核心</button>
            </div>
            <div id="preview-container" class="hidden border-t border-slate-50 pt-4">
                <h4 id="preview-title" class="font-bold text-slate-400 mb-3 text-sm px-2"></h4>
                <div id="preview-list" class="grid grid-cols-2 md:grid-cols-4 gap-2 max-h-60 overflow-y-auto px-1"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zeqemounpcjbhbksftoa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplcWVtb3VucGNqYmhia3NmdG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3NTI2NjIsImV4cCI6MjA4NzMyODY2Mn0.WAWfdmTygPQK3zJAeVO79pHKP7umHnFcouyykvT_x74'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function switchStudent() {
            if(confirm("確定要切換學生嗎？這將重置題數紀錄。")) {
                localStorage.removeItem('quizTotalCount');
                location.reload();
            }
        }

        function updateGameStatus() {
            const quizCount = parseInt(localStorage.getItem('quizTotalCount') || '0');
            const iconImg = document.getElementById('game-status-icon');
            const gameText = document.getElementById('game-text');

            if (quizCount >= 10) {
                iconImg.src = "https://img.icons8.com/fluency/48/joystick.png"; 
                gameText.className = "font-bold text-slate-800 text-lg";
            } else {
                iconImg.src = "https://img.icons8.com/fluency/48/lock.png"; 
                gameText.className = "font-bold text-slate-400 text-lg";
            }
        }

        function checkGameAccess() {
            const quizCount = parseInt(localStorage.getItem('quizTotalCount') || '0');
            if (quizCount >= 10) {
                window.location.href = 'game.html';
            } else {
                alert(`🔒 遊戲區尚未解鎖：\n目前已累積答題：${quizCount}/10\n請先完成一輪測驗喔！`);
            }
        }

        window.onload = updateGameStatus;

        async function loadPreview(level) {
            const container = document.getElementById('preview-container');
            const list = document.getElementById('preview-list');
            list.innerHTML = '<div class="col-span-full text-center text-slate-400 py-10">讀取中...</div>';
            container.classList.remove('hidden');
            const { data } = await supabaseClient.from('words').select('english, chinese').eq('level', level).range(0, 50);
            const names = { 'elementary': '國小基礎', 'junior': '國中必備', 'senior': '高中核心' };
            document.getElementById('preview-title').textContent = `📋 ${names[level]}`;
            list.innerHTML = ''; 
            data.forEach(word => {
                const item = document.createElement('div');
                item.className = "p-3 bg-slate-50 rounded-xl border border-slate-100 text-center shadow-sm";
                item.innerHTML = `<span class="block font-bold text-indigo-600">${word.english}</span><span class="text-sm text-black font-semibold">${word.chinese}</span>`;
                list.appendChild(item);
            });
        }
    </script>
</body>
</html>
