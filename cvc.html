<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短母音拼讀</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .container {
            /* 縮小容器最大寬度，讓整體方塊更集中、不拉長 */
            max-width: 380px;
            margin: 0 auto;
            padding: 0 10px;
        }
        .vowel-section {
            margin-bottom: 25px;
        }
        .vowel-title {
            font-size: 16px;
            font-weight: bold;
            color: #2980b9;
            background: #eef9ff;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .card {
            background: #fdfdfd;
            border: 1.5px solid #e1e8ed;
            border-radius: 6px;
            padding: 12px 4px; /* 調整 padding 配合長母音的方塊高度 */
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 45px; /* 改為與長母音相同的最小高度 */
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        .card:hover {
            background-color: #eef9ff;
            border-color: #3498db;
        }
        .word {
            font-family: Arial, sans-serif; /* 改為 Arial 字體 */
            font-size: 21px; /* 放大字體大小與長母音一致 */
            font-weight: bold;
            color: #2c3e50;
            letter-spacing: 0.5px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin: 30px 0;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>短母音拼讀</h1>
    <div id="content-container"></div>
    <a href="index.html" class="back-link">← 返回英語學習網站首頁</a>
</div>

<script>
    const cvcGroups = [
        {
            vowel: "Short A",
            words: ["cat", "bat", "hat", "mat", "rat", "sat", "fat", "pan", "can", "fan", "man", "van", "map", "nap", "cap", "tap", "bag", "tag", "rag", "wag", "dad", "jam"]
        },
        {
            vowel: "Short E",
            words: ["bed", "red", "fed", "led", "pen", "hen", "men", "den", "net", "pet", "wet", "vet", "jet", "web"]
        },
        {
            vowel: "Short I",
            words: ["big", "pig", "dig", "fig", "wig", "bin", "pin", "win", "tin", "lip", "tip", "hip", "zip", "sit", "hit", "pit", "kit", "mix", "fin"]
        },
        {
            vowel: "Short O",
            words: ["dog", "log", "jog", "pot", "hot", "cot", "dot", "top", "mop", "hop", "pop", "box", "fox", "mom", "cop"]
        },
        {
            vowel: "Short U",
            words: ["bug", "mug", "rug", "jug", "bun", "run", "sun", "fun", "nut", "cut", "hut", "tub", "sub", "rub", "cup", "mud", "gum"]
        }
    ];

    const container = document.getElementById('content-container');

    function speakWord(word) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        } else {
            alert('您的瀏覽器不支援語音朗讀功能');
        }
    }

    cvcGroups.forEach(group => {
        const seenInitials = new Set();
        const filteredAndSortedWords = group.words
            .filter(w => w && w.length >= 2)
            .sort((a, b) => a[0].localeCompare(b[0]))
            .filter(w => {
                const initial = w[0].toLowerCase();
                if (seenInitials.has(initial)) {
                    return false;
                }
                seenInitials.add(initial);
                return true;
            });

        group.words = filteredAndSortedWords;
    });

    cvcGroups.forEach(group => {
        const section = document.createElement('div');
        section.className = 'vowel-section';

        const title = document.createElement('div');
        title.className = 'vowel-title';
        title.innerText = group.vowel;
        section.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'grid';

        group.words.forEach(w => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<div class="word">${w}</div>`;
            card.addEventListener('click', () => speakWord(w));
            grid.appendChild(card);
        });

        section.appendChild(grid);
        container.appendChild(section);
    });
</script>

</body>
</html>
