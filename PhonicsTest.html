<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼讀疊疊樂</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 10px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .score-board {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .game-container {
            width: 320px;
            background: #111b21;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
            box-sizing: border-box;
        }
        .grid-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(14, 34px);
            gap: 3px;
            background: #0d1418;
            padding: 5px;
            border-radius: 8px;
        }
        .cell {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.08);
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px; 
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: #fff;
            user-select: none;
            cursor: pointer;
            transition: background 0.1s, transform 0.1s;
        }
        .cell.active {
            background: #3498db;
            border: 1.5px solid #5dade2;
            box-shadow: 0 2px 6px rgba(52, 152, 219, 0.5);
        }
        .cell.active:hover {
            background: #2980b9;
            transform: scale(1.02);
        }
        .cell.stacked {
            background: #4a5568;
            border: 1.5px solid #718096;
            color: #cbd5e0;
        }
        .cell.stacked:hover {
            background: #2b6cb0;
            border-color: #63b3ed;
        }
        .cell.correct-anim {
            background: #2ecc71 !important;
            transform: scale(1.1);
        }
        .cell.wrong-anim {
            background: #e74c3c !important;
        }
        .control-panel {
            margin-top: 12px;
            text-align: center;
            width: 320px;
        }
        .prompt-box {
            background: #fff;
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .prompt-text {
            font-size: 13px;
            color: #2c3e50;
            font-weight: bold;
            text-align: left;
            line-height: 1.3;
        }
        .sound-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .sound-btn:hover {
            background: #2980b9;
        }
        .btn-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }
        .action-btn {
            flex: 1;
            background: #2ecc71;
            color: white;
            border: none;
            padding: 9px 4px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background: #27ae60;
        }
        .action-btn.pause {
            background: #e67e22;
        }
        .action-btn.pause:hover {
            background: #d35400;
        }
        .action-btn.restart {
            background: #e74c3c;
        }
        .action-btn.restart:hover {
            background: #c0392b;
        }
        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(4px);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            display: none;
            z-index: 10;
        }
        .game-over-overlay h2 {
            margin: 0 0 10px 0;
            color: #e74c3c;
            font-size: 24px;
            text-align: center;
            padding: 0 10px;
        }
        .game-over-overlay p {
            margin: 0 0 20px 0;
            font-size: 16px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="score-board">得分: <span id="score">0</span></div>

<div class="game-container">
    <div class="grid-board" id="board"></div>
    <div class="game-over-overlay" id="gameOverOverlay">
        <h2 id="gameOverTitle">遊戲結束</h2>
        <p>最終得分: <span id="finalScore">0</span></p>
        <button class="sound-btn" onclick="startGame()">再玩一次</button>
    </div>
</div>

<div class="control-panel">
    <div class="prompt-box">
        <span class="prompt-text" id="promptText">點擊下方按鈕開始遊戲<br>聽語音提示並點擊對應單字消除！</span>
        <button class="sound-btn" onclick="playTargetSound()">🔊 重播聲音</button>
    </div>
    <div class="btn-row">
        <button class="action-btn" id="startBtn" onclick="startGame()">開始遊戲</button>
        <button class="action-btn pause" id="pauseBtn" onclick="togglePause()" disabled>暫停</button>
        <button class="action-btn restart" id="restartBtn" onclick="restartGame()" disabled>重來</button>
    </div>
</div>

<a href="index.html" class="back-link">← 返回英語學習網站首頁</a>

<script>
    const rows = 14;
    const cols = 3;
    let boardData = [];
    let gameInterval = null;
    let score = 0;
    let gameRunning = false;
    let isPaused = false;
    let currentTarget = null; 
    let dropSpeed = 2200;
    let emptyBoardSpawnRemaining = 0;
    let zeroScoreWrongCount = 0;

    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playPopSound() {
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        
        notes.forEach((freq, index) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + index * 0.05);

            gain.gain.setValueAtTime(0.15, now + index * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.05 + 0.25);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now + index * 0.05);
            osc.stop(now + index * 0.05 + 0.25);
        });
    }

    function playWrongSound() {
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(120, now + 0.2);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.2);
    }

    function playHomeworkSound() {
        initAudio();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        const tones = [300, 250, 200, 150];

        tones.forEach((freq, index) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + index * 0.12);

            gain.gain.setValueAtTime(0.2, now + index * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.12 + 0.15);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now + index * 0.12);
            osc.stop(now + index * 0.12 + 0.15);
        });
    }

    // 原始字庫分類
    const rawGamePool = [
        // 1. CVC 短母音系列
        {
            vowel: "Short A",
            words: ["cat", "bat", "hat", "mat", "rat", "sat", "fat", "pan", "can", "fan", "man", "van", "map", "nap", "cap", "tap", "bag", "tag", "rag", "wag", "dad", "jam"]
        },
        {
            vowel: "Short E",
            words: ["bed", "red", "fed", "led", "pen", "hen", "men", "den", "net", "pet", "wet", "vet", "jet", "web"]
        },
        {
            vowel: "Short I",
            words: ["big", "pig", "dig", "fig", "wig", "bin", "pin", "win", "tin", "lip", "tip", "hip", "zip", "sit", "hit", "pit", "kit", "mix", "fin"]
        },
        {
            vowel: "Short O",
            words: ["dog", "log", "jog", "pot", "hot", "cot", "dot", "top", "mop", "hop", "pop", "box", "fox", "mom", "cop"]
        },
        {
            vowel: "Short U",
            words: ["bug", "mug", "rug", "jug", "bun", "run", "sun", "fun", "nut", "cut", "hut", "tub", "sub", "rub", "cup", "mud", "gum"]
        },

        // 2. 長母音系列 (LONG A, E, I, O, U)
        {
            vowel: "Long A",
            words: ["gate", "pail", "day", "wave", "rain", "play"]
        },
        {
            vowel: "Long E",
            words: ["Eve", "peach", "green", "these", "tea", "tree"]
        },
        {
            vowel: "Long I",
            words: ["bite", "pie", "light", "rice", "tie", "night"]
        },
        {
            vowel: "Long O",
            words: ["hole", "boat", "snow", "mole", "goat", "yellow"]
        },
        {
            vowel: "Long U",
            words: ["cute", "blue", "fruit", "few", "tube", "glue", "suit", "draw"]
        },

        // 3. 子音組系列 (Consonant Blends & Digraphs)
        { vowel: "th (無聲)", words: ["three", "teeth", "mouth"] },
        { vowel: "th (有聲)", words: ["this", "father", "mother"] },
        { vowel: "wh", words: ["white", "wheel", "whale"] },
        { vowel: "ph", words: ["photo", "phone", "dolphin"] },
        { vowel: "sh", words: ["shirt", "fish", "wash"] },
        { vowel: "ch", words: ["chips", "cheese", "lunch"] },
        { vowel: "ng", words: ["sing", "king", "song"] },
        { vowel: "nk", words: ["sink", "pink", "rink"] },
        { vowel: "bl", words: ["black", "block", "blue"] },
        { vowel: "pl", words: ["plane", "plant", "plum"] },
        { vowel: "gl", words: ["glad", "glass", "glue"] },
        { vowel: "cl", words: ["clay", "clean", "clap"] },
        { vowel: "br", words: ["bread", "brown", "brick"] },
        { vowel: "pr", words: ["prince", "prize", "print"] },
        { vowel: "gr", words: ["grapes", "grass", "green"] },
        { vowel: "cr", words: ["crab", "crush", "cry"] },
        { vowel: "tr", words: ["train", "tree", "truck"] },
        { vowel: "dr", words: ["dragonfly", "draw", "drum"] },
        { vowel: "sp", words: ["spoon", "spy", "spot"] },
        { vowel: "st", words: ["star", "storm", "stop"] },
        { vowel: "sk", words: ["ski", "sky", "skin"] }
    ];

    // 展開成扁平化的遊戲選單 { display, sound }
    let gamePool = [];
    rawGamePool.forEach(group => {
        group.words.forEach(w => {
            gamePool.push({ display: w, sound: w });
        });
    });

    const boardElement = document.getElementById('board');

    function initBoardDOM() {
        boardElement.innerHTML = '';
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                cell.addEventListener('click', () => handleCellClick(r, c));
                boardElement.appendChild(cell);
            }
        }
    }

    function initBoardData() {
        boardData = [];
        for (let r = 0; r < rows; r++) {
            boardData[r] = new Array(cols).fill(null);
        }
    }

    function startGame() {
        initAudio();
        document.getElementById('gameOverOverlay').style.display = 'none';
        document.getElementById('startBtn').innerText = '進行中';
        document.getElementById('startBtn').disabled = true;
        document.getElementById('pauseBtn').disabled = false;
        document.getElementById('pauseBtn').innerText = '暫停';
        document.getElementById('restartBtn').disabled = false;
        
        score = 0;
        emptyBoardSpawnRemaining = 2;
        zeroScoreWrongCount = 0;
        document.getElementById('score').innerText = score;
        dropSpeed = 2200;
        gameRunning = true;
        isPaused = false;
        
        initBoardData();
        renderBoard();

        spawnRow();
        renderBoard();
        pickNewQuestion();

        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, dropSpeed);
    }

    function togglePause() {
        if (!gameRunning) return;
        isPaused = !isPaused;
        const pauseBtn = document.getElementById('pauseBtn');
        if (isPaused) {
            pauseBtn.innerText = '繼續';
            document.getElementById('promptText').innerHTML = `遊戲已暫停，請思考...`;
            if (window.speechSynthesis) window.speechSynthesis.cancel();
        } else {
            pauseBtn.innerText = '暫停';
            if (currentTarget) {
                document.getElementById('promptText').innerHTML = `請聽聲音並點擊: <b style="color:#2980b9;">${currentTarget.display}</b>`;
            }
        }
    }

    function restartGame() {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        if (gameInterval) clearInterval(gameInterval);
        startGame();
    }

    function gameLoop() {
        if (!gameRunning || isPaused) return;

        for (let c = 0; c < cols; c++) {
            if (boardData[0][c] !== null && boardData[0][c].state === 'stacked') {
                gameOver('stack');
                return;
            }
        }

        for (let r = rows - 1; r >= 0; r--) {
            for (let c = 0; c < cols; c++) {
                if (boardData[r][c] && boardData[r][c].state === 'active') {
                    if (r + 1 < rows && boardData[r + 1][c] === null) {
                        boardData[r + 1][c] = boardData[r][c];
                        boardData[r][c] = null;
                    } else {
                        boardData[r][c].state = 'stacked';
                    }
                }
            }
        }

        for (let c = 0; c < cols; c++) {
            if (boardData[0][c] !== null && boardData[0][c].state === 'stacked') {
                renderBoard();
                gameOver('stack');
                return;
            }
        }

        spawnRow();
        renderBoard();
        pickNewQuestion();
    }

    function spawnRow() {
        for (let c = 0; c < cols; c++) {
            if (boardData[0][c] !== null) return;
        }

        let totalBlocksOnBoard = 0;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (boardData[r][c] !== null) {
                    totalBlocksOnBoard++;
                }
            }
        }

        if (totalBlocksOnBoard === 0) {
            emptyBoardSpawnRemaining = 2;
        }

        let count = 1;
        if (emptyBoardSpawnRemaining > 0) {
            count = 3;
            emptyBoardSpawnRemaining--;
        } else {
            let hasStackedBlocks = false;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (boardData[r][c] !== null && boardData[r][c].state === 'stacked') {
                        hasStackedBlocks = true;
                        break;
                    }
                }
                if (hasStackedBlocks) break;
            }
            count = hasStackedBlocks ? 1 : (Math.random() < 0.65 ? 1 : 2);
        }

        let shuffledCols = [0, 1, 2].sort(() => 0.5 - Math.random());

        for (let i = 0; i < count; i++) {
            let targetCol = shuffledCols[i];
            let randomItem = gamePool[Math.floor(Math.random() * gamePool.length)];
            
            boardData[0][targetCol] = {
                display: randomItem.display,
                sound: randomItem.sound,
                state: 'active'
            };
        }
    }

    function pickNewQuestion() {
        if (!gameRunning) return;

        let stackedItems = [];
        let allItems = [];

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (boardData[r][c] !== null) {
                    allItems.push(boardData[r][c]);
                    if (boardData[r][c].state === 'stacked') {
                        stackedItems.push(boardData[r][c]);
                    }
                }
            }
        }

        let currentTargetStillOnBoard = false;
        if (currentTarget) {
            currentTargetStillOnBoard = allItems.some(item => item.sound === currentTarget.sound);
        }

        if (!currentTarget || !currentTargetStillOnBoard) {
            let candidatePool = [];

            if (stackedItems.length > 0) {
                candidatePool = stackedItems;
            } else {
                candidatePool = allItems;
            }

            if (candidatePool.length > 0) {
                let chosen = candidatePool[Math.floor(Math.random() * candidatePool.length)];
                currentTarget = {
                    display: chosen.display,
                    sound: chosen.sound
                };
                if (!isPaused) {
                    document.getElementById('promptText').innerHTML = `請聽聲音並點擊: <b style="color:#2980b9;">${currentTarget.display}</b>`;
                    playTargetSound();
                }
            }
        }
    }

    function playTargetSound() {
        if (!currentTarget || !gameRunning || isPaused) return;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(currentTarget.sound);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    function applyStackedGravity() {
        for (let c = 0; c < cols; c++) {
            for (let r = rows - 2; r >= 0; r--) {
                if (boardData[r][c] !== null && boardData[r][c].state === 'stacked') {
                    let currentRow = r;
                    while (currentRow + 1 < rows && boardData[currentRow + 1][c] === null) {
                        boardData[currentRow + 1][c] = boardData[currentRow][c];
                        boardData[currentRow][c] = null;
                        currentRow++;
                    }
                }
            }
        }
    }

    function handleCellClick(r, c) {
        if (!gameRunning || isPaused || !currentTarget) return;
        let item = boardData[r][c];
        if (!item) return;

        const cellDiv = document.querySelector(`[data-row='${r}'][data-col='${c}']`);

        if (item.sound === currentTarget.sound) {
            zeroScoreWrongCount = 0;
            let matchCount = 0;

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    if (boardData[row][col] !== null && boardData[row][col].sound === currentTarget.sound) {
                        boardData[row][col] = null;
                        matchCount++;
                        const matchDiv = document.querySelector(`[data-row='${row}'][data-col='${col}']`);
                        if (matchDiv) matchDiv.classList.add('correct-anim');
                    }
                }
            }

            playPopSound();

            score += matchCount * 10;
            document.getElementById('score').innerText = score;

            if (score >= 60 && score % 60 === 0 && dropSpeed > 1000) {
                dropSpeed -= 200;
                clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, dropSpeed);
            }

            setTimeout(() => {
                applyStackedGravity();
                renderBoard();
                pickNewQuestion();
            }, 200);
        } else {
            playWrongSound();
            score = Math.max(0, score - 10);
            document.getElementById('score').innerText = score;
            cellDiv.classList.add('wrong-anim');
            setTimeout(() => renderBoard(), 200);

            if (score === 0) {
                zeroScoreWrongCount++;
                if (zeroScoreWrongCount >= 3) {
                    gameOver('homework');
                }
            }
        }
    }

    function renderBoard() {
        const cells = document.querySelectorAll('.cell');
        cells.forEach(cell => {
            const r = parseInt(cell.dataset.row);
            const c = parseInt(cell.dataset.col);
            const item = boardData[r][c];

            cell.className = 'cell';
            cell.innerText = '';

            if (item) {
                cell.innerText = item.display;
                if (item.state === 'active') {
                    cell.classList.add('active');
                } else if (item.state === 'stacked') {
                    cell.classList.add('stacked');
                }
            }
        });
    }

    function gameOver(reason = 'stack') {
        gameRunning = false;
        isPaused = false;
        clearInterval(gameInterval);
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        
        const titleElem = document.getElementById('gameOverTitle');
        if (reason === 'homework') {
            titleElem.innerText = "恭喜你要寫作業了！";
            playHomeworkSound();
        } else {
            titleElem.innerText = "遊戲結束";
        }

        document.getElementById('finalScore').innerText = score;
        document.getElementById('gameOverOverlay').style.display = 'flex';
        document.getElementById('startBtn').innerText = '開始遊戲';
        document.getElementById('startBtn').disabled = false;
        document.getElementById('pauseBtn').disabled = true;
        document.getElementById('restartBtn').disabled = true;
    }

    initBoardDOM();
</script>

</body>
</html>
