<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語拼讀俄羅斯方塊</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 15px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 24px;
            text-align: center;
        }
        .score-board {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .game-container {
            width: 320px;
            background: #111b21;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
            box-sizing: border-box;
        }
        .grid-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(10, 42px);
            gap: 4px;
            background: #0d1418;
            padding: 6px;
            border-radius: 8px;
        }
        .cell {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
            user-select: none;
            cursor: pointer;
            transition: background 0.1s, transform 0.1s;
        }
        .cell.active {
            background: #3498db;
            border: 1.5px solid #5dade2;
            box-shadow: 0 2px 6px rgba(52, 152, 219, 0.5);
        }
        .cell.active:hover {
            background: #2980b9;
            transform: scale(1.02);
        }
        .cell.stacked {
            background: #4a5568;
            border: 1.5px solid #718096;
            color: #cbd5e0;
        }
        .cell.stacked:hover {
            background: #2b6cb0;
            border-color: #63b3ed;
        }
        .cell.correct-anim {
            background: #2ecc71 !important;
            transform: scale(1.1);
        }
        .cell.wrong-anim {
            background: #e74c3c !important;
        }
        .control-panel {
            margin-top: 15px;
            text-align: center;
            width: 320px;
        }
        .prompt-box {
            background: #fff;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .prompt-text {
            font-size: 13px;
            color: #2c3e50;
            font-weight: bold;
            text-align: left;
            line-height: 1.3;
        }
        .sound-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .sound-btn:hover {
            background: #2980b9;
        }
        .btn-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .action-btn {
            flex: 1;
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .action-btn:hover {
            background: #27ae60;
        }
        .action-btn.pause {
            background: #e67e22;
        }
        .action-btn.pause:hover {
            background: #d35400;
        }
        .action-btn.restart {
            background: #e74c3c;
        }
        .action-btn.restart:hover {
            background: #c0392b;
        }
        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(4px);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            display: none;
            z-index: 10;
        }
        .game-over-overlay h2 {
            margin: 0 0 10px 0;
            color: #e74c3c;
            font-size: 26px;
        }
        .game-over-overlay p {
            margin: 0 0 20px 0;
            font-size: 16px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<h1>英語拼讀俄羅斯方塊</h1>
<div class="score-board">得分: <span id="score">0</span></div>

<div class="game-container">
    <div class="grid-board" id="board"></div>
    <div class="game-over-overlay" id="gameOverOverlay">
        <h2>遊戲結束</h2>
        <p>最終得分: <span id="finalScore">0</span></p>
        <button class="sound-btn" onclick="startGame()">再玩一次</button>
    </div>
</div>

<div class="control-panel">
    <div class="prompt-box">
        <span class="prompt-text" id="promptText">點擊下方按鈕開始遊戲<br>聽語音提示消除所有相同的單字！</span>
        <button class="sound-btn" onclick="playTargetSound()">🔊 重播聲音</button>
    </div>
    <div class="btn-row">
        <button class="action-btn" id="startBtn" onclick="startGame()">開始遊戲</button>
        <button class="action-btn pause" id="pauseBtn" onclick="togglePause()" disabled>暫停</button>
        <button class="action-btn restart" id="restartBtn" onclick="restartGame()" disabled>重來</button>
    </div>
</div>

<a href="index.html" class="back-link">← 返回英語學習網站首頁</a>

<script>
    const rows = 10;
    const cols = 3;
    let boardData = [];
    let gameInterval = null;
    let score = 0;
    let gameRunning = false;
    let isPaused = false;
    let currentTarget = null; 
    let dropSpeed = 1500;

    const gamePool = [
        // 短母音
        { display: "cat", sound: "cat" }, { display: "bat", sound: "bat" }, { display: "hat", sound: "hat" },
        { display: "pan", sound: "pan" }, { display: "can", sound: "can" }, { display: "map", sound: "map" },
        { display: "bed", sound: "bed" }, { display: "red", sound: "red" }, { display: "pen", sound: "pen" },
        { display: "big", sound: "big" }, { display: "pig", sound: "pig" }, { display: "bin", sound: "bin" },
        { display: "dog", sound: "dog" }, { display: "pot", sound: "pot" }, { display: "box", sound: "box" },
        { display: "bug", sound: "bug" }, { display: "run", sound: "run" }, { display: "cup", sound: "cup" },
        
        // 長母音
        { display: "gate", sound: "gate" }, { display: "day", sound: "day" }, { display: "rain", sound: "rain" },
        { display: "green", sound: "green" }, { display: "tree", sound: "tree" }, { display: "peach", sound: "peach" },
        { display: "bite", sound: "bite" }, { display: "pie", sound: "pie" }, { display: "light", sound: "light" },
        { display: "boat", sound: "boat" }, { display: "snow", sound: "snow" }, { display: "hole", sound: "hole" },
        { display: "blue", sound: "blue" }, { display: "cute", sound: "cute" }, { display: "fruit", sound: "fruit" },

        // 子音組
        { display: "shirt", sound: "shirt" }, { display: "fish", sound: "fish" },
        { display: "chips", sound: "chips" }, { display: "cheese", sound: "cheese" },
        { display: "three", sound: "three" }, { display: "teeth", sound: "teeth" },
        { display: "white", sound: "white" }, { display: "wheel", sound: "wheel" },
        { display: "photo", sound: "photo" }, { display: "phone", sound: "phone" },
        { display: "black", sound: "black" }, { display: "blue", sound: "blue" },
        { display: "plane", sound: "plane" }, { display: "plant", sound: "plant" },
        { display: "star", sound: "star" }, { display: "stop", sound: "stop" }
    ];

    const boardElement = document.getElementById('board');

    function initBoardDOM() {
        boardElement.innerHTML = '';
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r;
                cell.dataset.col = c;
                cell.addEventListener('click', () => handleCellClick(r, c));
                boardElement.appendChild(cell);
            }
        }
    }

    function initBoardData() {
        boardData = [];
        for (let r = 0; r < rows; r++) {
            boardData[r] = new Array(cols).fill(null);
        }
    }

    function startGame() {
        document.getElementById('gameOverOverlay').style.display = 'none';
        document.getElementById('startBtn').innerText = '進行中';
        document.getElementById('startBtn').disabled = true;
        document.getElementById('pauseBtn').disabled = false;
        document.getElementById('pauseBtn').innerText = '暫停';
        document.getElementById('restartBtn').disabled = false;
        
        score = 0;
        document.getElementById('score').innerText = score;
        dropSpeed = 1500;
        gameRunning = true;
        isPaused = false;
        
        initBoardData();
        renderBoard();

        // 初始生成第一行方塊
        spawnRow();
        renderBoard();

        // 挑選第一道題目並發音
        pickNewQuestion();

        // 方塊逐秒下落迴圈
        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(gameLoop, dropSpeed);
    }

    function togglePause() {
        if (!gameRunning) return;
        isPaused = !isPaused;
        const pauseBtn = document.getElementById('pauseBtn');
        if (isPaused) {
            pauseBtn.innerText = '繼續';
            document.getElementById('promptText').innerHTML = `遊戲已暫停，請思考...`;
            if (window.speechSynthesis) window.speechSynthesis.cancel();
        } else {
            pauseBtn.innerText = '暫停';
            if (currentTarget) {
                document.getElementById('promptText').innerHTML = `請聽聲音點選: <b style="color:#2980b9;">${currentTarget.display}</b>`;
            }
        }
    }

    function restartGame() {
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        if (gameInterval) clearInterval(gameInterval);
        startGame();
    }

    function gameLoop() {
        if (!gameRunning || isPaused) return;

        // 1. 檢查最頂層（row 0）是否有堆疊方塊，若有則 GAME OVER
        for (let c = 0; c < cols; c++) {
            if (boardData[0][c] !== null && boardData[0][c].state === 'stacked') {
                gameOver();
                return;
            }
        }

        // 2. 讓所有正在下落的方塊往下移動一格
        for (let r = rows - 1; r >= 0; r--) {
            for (let c = 0; c < cols; c++) {
                if (boardData[r][c] && boardData[r][c].state === 'active') {
                    if (r + 1 < rows && boardData[r + 1][c] === null) {
                        boardData[r + 1][c] = boardData[r][c];
                        boardData[r][c] = null;
                    } else {
                        boardData[r][c].state = 'stacked';
                    }
                }
            }
        }

        // 檢查堆疊是否頂到最上方
        for (let c = 0; c < cols; c++) {
            if (boardData[0][c] !== null && boardData[0][c].state === 'stacked') {
                renderBoard();
                gameOver();
                return;
            }
        }

        // 3. 頂部生成新的一行方塊
        spawnRow();
        renderBoard();
    }

    function spawnRow() {
        for (let c = 0; c < cols; c++) {
            if (boardData[0][c] !== null) return;
        }

        let shuffledCols = [0, 1, 2].sort(() => 0.5 - Math.random());
        let count = Math.random() < 0.65 ? 1 : 2;

        for (let i = 0; i < count; i++) {
            let targetCol = shuffledCols[i];
            let randomItem = gamePool[Math.floor(Math.random() * gamePool.length)];
            
            boardData[0][targetCol] = {
                display: randomItem.display,
                sound: randomItem.sound,
                state: 'active'
            };
        }
    }

    // 從畫面上現有的方塊隨機挑選一個作為目標題目
    function pickNewQuestion() {
        if (!gameRunning) return;

        let allItems = [];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (boardData[r][c] !== null) {
                    allItems.push(boardData[r][c]);
                }
            }
        }

        if (allItems.length > 0) {
            let chosen = allItems[Math.floor(Math.random() * allItems.length)];
            currentTarget = {
                display: chosen.display,
                sound: chosen.sound
            };
            if (!isPaused) {
                document.getElementById('promptText').innerHTML = `請聽聲音點選: <b style="color:#2980b9;">${currentTarget.display}</b>`;
                playTargetSound();
            }
        } else {
            currentTarget = null;
            document.getElementById('promptText').innerHTML = `等待新方塊落下...`;
        }
    }

    function playTargetSound() {
        if (!currentTarget || !gameRunning || isPaused) return;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(currentTarget.sound);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    // 只讓已落地的堆疊方塊（stacked）受地心引力影響向下掉落填補空格，空中的 active 方塊保持不變
    function applyStackedGravity() {
        for (let c = 0; c < cols; c++) {
            // 從倒數第二列往上檢查堆疊方塊
            for (let r = rows - 2; r >= 0; r--) {
                if (boardData[r][c] !== null && boardData[r][c].state === 'stacked') {
                    let currentRow = r;
                    // 一路往下檢查，只要下方是空格就往下掉（只針對 stacked）
                    while (currentRow + 1 < rows && boardData[currentRow + 1][c] === null) {
                        boardData[currentRow + 1][c] = boardData[currentRow][c];
                        boardData[currentRow][c] = null;
                        currentRow++;
                    }
                }
            }
        }
    }

    function handleCellClick(r, c) {
        if (!gameRunning || isPaused || !currentTarget) return;
        let item = boardData[r][c];
        if (!item) return; // 點擊空白處不處理

        const cellDiv = document.querySelector(`[data-row='${r}'][data-col='${c}']`);

        // 檢查玩家點選的方塊是否符合當前目標聲音（支援畫面中所有同名單字一起消除）
        if (item.sound === currentTarget.sound) {
            let matchCount = 0;

            // 找出畫面上所有符合該 sound 的方塊並全部消除
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    if (boardData[row][col] !== null && boardData[row][col].sound === currentTarget.sound) {
                        boardData[row][col] = null;
                        matchCount++;
                        // 為被消除的格子加上動畫效果
                        const matchDiv = document.querySelector(`[data-row='${row}'][data-col='${col}']`);
                        if (matchDiv) matchDiv.classList.add('correct-anim');
                    }
                }
            }

            score += matchCount * 10;
            document.getElementById('score').innerText = score;

            if (score >= 50 && score % 50 === 0 && dropSpeed > 800) {
                dropSpeed -= 150;
                clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, dropSpeed);
            }

            setTimeout(() => {
                // 方塊消除後，只讓已落地的堆疊方塊受地心引力影響下落填補空格
                applyStackedGravity();
                renderBoard();
                // 產生下一題
                pickNewQuestion();
            }, 200);
        } else {
            // 答錯：扣分與錯誤動畫
            score = Math.max(0, score - 3);
            document.getElementById('score').innerText = score;
            cellDiv.classList.add('wrong-anim');
            setTimeout(() => renderBoard(), 200);
        }
    }

    function renderBoard() {
        const cells = document.querySelectorAll('.cell');
        cells.forEach(cell => {
            const r = parseInt(cell.dataset.row);
            const c = parseInt(cell.dataset.col);
            const item = boardData[r][c];

            cell.className = 'cell';
            cell.innerText = '';

            if (item) {
                cell.innerText = item.display;
                if (item.state === 'active') {
                    cell.classList.add('active');
                } else if (item.state === 'stacked') {
                    cell.classList.add('stacked');
                }
            }
        });
    }

    function gameOver() {
        gameRunning = false;
        isPaused = false;
        clearInterval(gameInterval);
        if (window.speechSynthesis) window.speechSynthesis.cancel();
        document.getElementById('finalScore').innerText = score;
        document.getElementById('gameOverOverlay').style.display = 'flex';
        document.getElementById('startBtn').innerText = '開始遊戲';
        document.getElementById('startBtn').disabled = false;
        document.getElementById('pauseBtn').disabled = true;
        document.getElementById('restartBtn').disabled = true;
    }

    initBoardDOM();
</script>

</body>
</html>
