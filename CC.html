<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子音組拼讀</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .container {
            max-width: 380px;
            margin: 0 auto;
            padding: 0 10px;
        }
        .vowel-section {
            margin-bottom: 25px;
        }
        .vowel-title {
            font-size: 16px;
            font-weight: bold;
            color: #2980b9;
            background: #eef9ff;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }
        .card {
            background: #fdfdfd;
            border: 1.5px solid #e1e8ed;
            border-radius: 6px;
            padding: 8px 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 36px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }
        .card:hover {
            background-color: #eef9ff;
            border-color: #3498db;
        }
        .word {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            letter-spacing: 0.5px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin: 30px 0;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>子音組拼讀</h1>
    <div id="content-container"></div>
    <a href="index.html" class="back-link">← 返回英語學習網站首頁</a>
</div>

<script>
    const consonantGroups = [
        { vowel: "th (無聲)", words: ["three", "teeth", "mouth"] },
        { vowel: "th (有聲)", words: ["this", "father", "mother"] },
        { vowel: "wh", words: ["white", "wheel", "whale"] },
        { vowel: "ph", words: ["photo", "phone", "dolphin"] },
        { vowel: "sh", words: ["shirt", "fish", "wash"] },
        { vowel: "ch", words: ["chips", "cheese", "lunch"] },
        { vowel: "ng", words: ["sing", "king", "song"] },
        { vowel: "nk", words: ["sink", "pink", "rink"] },
        { vowel: "bl", words: ["black", "block", "blue"] },
        { vowel: "pl", words: ["plane", "plant", "plum"] },
        { vowel: "gl", words: ["glad", "glass", "glue"] },
        { vowel: "cl", words: ["clay", "clean", "clap"] },
        { vowel: "br", words: ["bread", "brown", "brick"] },
        { vowel: "pr", words: ["prince", "prize", "print"] },
        { vowel: "gr", words: ["grapes", "grass", "green"] },
        { vowel: "cr", words: ["crab", "crush", "cry"] },
        { vowel: "tr", words: ["train", "tree", "truck"] },
        { vowel: "dr", words: ["dragonfly", "draw", "drum"] },
        { vowel: "sp", words: ["spoon", "spy", "spot"] },
        { vowel: "st", words: ["star", "storm", "stop"] },
        { vowel: "sk", words: ["ski", "sky", "skin"] }
    ];

    const container = document.getElementById('content-container');

    function speakWord(word) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        } else {
            alert('您的瀏覽器不支援語音朗讀功能');
        }
    }

    consonantGroups.forEach(group => {
        const section = document.createElement('div');
        section.className = 'vowel-section';

        const title = document.createElement('div');
        title.className = 'vowel-title';
        title.innerText = group.vowel;
        section.appendChild(title);

        const grid = document.createElement('div');
        grid.className = 'grid';

        group.words.forEach(w => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<div class="word">${w}</div>`;
            card.addEventListener('click', () => speakWord(w));
            grid.appendChild(card);
        });

        section.appendChild(grid);
        container.appendChild(section);
    });
</script>

</body>
</html>
