<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語好簡單 - 單字王比賽</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f0f4f8; }
        .hidden { display: none; }
        .option-correct { background-color: #22c55e !important; color: white !important; border-color: #16a34a !important; }
        .option-wrong { background-color: #ef4444 !important; color: white !important; border-color: #dc2626 !important; }
        .toggle-checkbox:checked { right: 0; border-color: #4f46e5; }
        .toggle-checkbox:checked + .toggle-label { background-color: #4f46e5; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        #custom-alert {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 9999;
            align-items: center; justify-content: center;
        }
        .alert-content {
            background: white; padding: 2.5rem 2rem; border-radius: 2rem;
            text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            width: 85%; max-width: 340px;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="custom-alert">
        <div class="alert-content">
            <p id="alert-message" class="text-2xl font-bold text-slate-800 mb-8 leading-relaxed"></p>
            <button onclick="closeMyAlert()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg hover:bg-indigo-700 transition active:scale-95">確定</button>
        </div>
    </div>

    <div id="app" class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-6 border border-slate-100">
        
        <!-- 等級與登入選單畫面 -->
        <div id="level-selection" class="space-y-6">
            <button onclick="window.location.href='index.html'" class="text-sm text-indigo-600 hover:underline">← 返回大廳</button>
            
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                <p class="text-sm font-bold text-slate-600 flex items-center">👤 學生登入</p>
                <div class="flex gap-2">
                    <input type="number" id="class-id" placeholder="班級座號" class="w-2/3 p-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-indigo-500">
                    <input type="text" id="stu-name" placeholder="英文名" class="w-1/3 p-3 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button onclick="loginAndLoad()" id="login-btn" class="w-full py-3 bg-slate-800 text-white rounded-xl font-bold shadow-md hover:bg-slate-700 transition">登入並讀取紀錄</button>
            </div>

            <div id="personal-error-container" class="hidden bg-red-50 p-4 rounded-2xl border border-red-100">
                <h3 class="font-bold text-red-600 mb-2 flex justify-between items-center text-sm">
                    <span>🔥 歷史錯題複習 (答對自動移除)</span>
                </h3>
                <div id="error-list-content" class="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto custom-scrollbar p-1 text-black"></div>
                <button onclick="startErrorQuiz()" class="w-full mt-3 py-3 bg-red-500 text-white rounded-xl font-bold hover:bg-red-600 shadow-lg">進入錯題衝刺模式</button>
            </div>

            <div id="level-buttons" class="grid grid-cols-1 gap-3 pt-4 border-t border-slate-100">
                <button onclick="selectLevel('elementary')" class="py-4 bg-green-500 text-white rounded-2xl font-bold shadow-lg hover:bg-green-600 transition text-lg">國小基礎</button>
                <button onclick="selectLevel('junior')" class="py-4 bg-blue-500 text-white rounded-2xl font-bold shadow-lg hover:bg-blue-600 transition text-lg">國中必備</button>
                <button onclick="selectLevel('senior')" class="py-4 bg-purple-500 text-white rounded-2xl font-bold shadow-lg hover:bg-purple-600 transition text-lg">高中核心</button>
                <button onclick="startWordKingMode()" class="py-4 bg-amber-500 text-white rounded-2xl font-bold shadow-lg hover:bg-amber-600 transition text-lg flex items-center justify-center gap-2">🏆 單字王比賽</button>
            </div>
        </div>

        <!-- 一般測驗類型選單畫面 -->
        <div id="quiz-selection" class="hidden space-y-6 text-center">
            <button onclick="showScreen('level-selection')" class="text-sm text-indigo-600 hover:underline">← 返回選擇等級</button>
            <h2 id="welcome-msg" class="text-xl font-bold text-slate-700"></h2>
            <div class="space-y-4">
                <button onclick="startQuiz('eng-to-chi')" class="w-full py-5 bg-indigo-600 text-white rounded-2xl font-bold shadow-xl hover:bg-indigo-700">英 ➔ 中 測驗</button>
                <button onclick="startQuiz('chi-to-eng')" class="w-full py-5 bg-white text-indigo-600 border-2 border-indigo-600 rounded-2xl font-bold hover:bg-indigo-50">中 ➔ 英 測驗</button>
            </div>
        </div>

        <!-- 測驗進行中畫面 -->
        <div id="quiz-screen" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <button onclick="confirmExit()" class="text-xs bg-slate-200 px-3 py-1.5 rounded-full text-slate-600 font-bold">✕ 結束測驗</button>
                <div id="wordking-timer-badge" class="hidden text-xs bg-amber-100 text-amber-800 px-3 py-1 rounded-full font-bold">⏱️ 已用時間: <span id="timer-display">0.0</span>秒</div>
                <div class="flex items-center space-x-2">
                    <span class="text-[10px] text-slate-400 font-bold">自動發音</span>
                    <label class="relative inline-block w-10 h-6">
                        <input type="checkbox" id="auto-voice" checked class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer right-4 border-slate-300"/>
                        <span class="toggle-label block overflow-hidden h-6 rounded-full bg-slate-300 cursor-pointer"></span>
                    </label>
                </div>
            </div>
            <div class="text-center mb-6">
                <div id="wordking-progress" class="text-xs text-slate-400 font-bold mb-1"></div>
                <h2 id="question-text" class="text-4xl font-bold text-slate-800 mb-4"></h2>
                <div class="flex items-center justify-center space-x-6">
                    <button onclick="speakWord()" class="px-6 py-2 bg-indigo-50 text-indigo-600 rounded-full text-sm font-bold border border-indigo-100">🔊 聽聲音</button>
                    <div class="text-slate-400 text-sm font-bold">得分: <span id="score" class="text-indigo-600">0</span></div>
                </div>
            </div>
            <div id="options-container" class="grid grid-cols-1 gap-2"></div>
        </div>

        <!-- 一般測驗結束畫面 -->
        <div id="result-screen" class="hidden text-center">
            <div class="py-10">
                <span class="text-6xl mb-4 block">🎉</span>
                <h2 class="text-3xl font-bold text-slate-800 mb-2">測驗結束！</h2>
                <p class="text-slate-500 text-xl font-bold">得分：<span id="final-score" class="text-indigo-600">0</span></p>
            </div>
            <button onclick="showScreen('level-selection')" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg hover:bg-indigo-700">回到測驗首頁</button>
        </div>

        <!-- 單字王專屬結算與獨立排行榜畫面 -->
        <div id="wordking-result-screen" class="hidden text-center space-y-3">
            <div class="py-2">
                <span class="text-4xl mb-1 block">🏆</span>
                <h2 class="text-xl font-bold text-slate-800">單字王爭霸戰完成！</h2>
                <p class="text-slate-600 text-xs font-bold mt-0.5">正確答題數: <span id="wk-correct-count" class="text-indigo-600">0</span> / 25 | 總耗時: <span id="wk-time">0</span>秒</p>
                <p class="text-amber-600 font-extrabold text-base mt-0.5">綜合積分: <span id="wk-final-score">0</span></p>
            </div>

            <div id="wk-submit-box" class="space-y-1.5 bg-slate-50 p-2.5 rounded-2xl border">
                <p class="text-[11px] text-slate-500 font-bold">請輸入您的單字王英雄榜顯示名稱 (例如: 601_John)</p>
                <div class="flex gap-2">
                    <input type="text" id="wk-nickname" placeholder="輸入暱稱" maxlength="12" class="w-2/3 p-2 text-center rounded-xl border border-slate-300 outline-none text-xs font-bold">
                    <button onclick="submitWordKingScore()" class="w-1/3 py-2 bg-amber-500 text-white rounded-xl font-bold hover:bg-amber-600 text-xs shadow-md">送出成績</button>
                </div>
            </div>

            <div class="bg-slate-900 text-white p-3 rounded-2xl text-left">
                <h3 class="text-xs font-bold text-amber-400 mb-2 text-center">🌟 單字王排行榜</h3>
                <ul id="leaderboard-list" class="space-y-1 text-xs max-h-32 overflow-y-auto custom-scrollbar pr-1">
                    <li class="text-center text-slate-400 py-2">載入中...</li>
                </ul>
            </div>

            <button onclick="showScreen('level-selection')" class="w-full py-3 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg hover:bg-indigo-700 text-sm">返回首頁</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zeqemounpcjbhbksftoa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplcWVtb3VucGNqYmhia3NmdG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3NTI2NjIsImV4cCI6MjA4NzMyODY2Mn0.WAWfdmTygPQK3zJAeVO79pHKP7umHnFcouyykvT_x74'; 
        const myApp = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allWords = [];
        let shuffledVocabulary = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let studentId = "";
        let isReviewingErrors = false;
        let isAnswering = false;
        let currentQuizType = "";

        // 單字王比賽專屬變數
        let isWordKingMode = false;
        let wkStartTime = 0;
        let wkTimerInterval = null;
        let wkElapsedSeconds = 0;
        let wkCorrectCount = 0;

        function myAlert(msg) {
            document.getElementById('alert-message').textContent = msg;
            document.getElementById('custom-alert').style.display = 'flex';
        }
        function closeMyAlert() {
            document.getElementById('custom-alert').style.display = 'none';
        }

        async function loginAndLoad() {
            const classVal = document.getElementById('class-id').value;
            const nameVal = document.getElementById('stu-name').value;
            if (!classVal || !nameVal) return myAlert("請完成登入資料填寫");

            studentId = `${classVal}_${nameVal}`;
            document.getElementById('login-btn').textContent = "讀取中...";

            document.getElementById('wk-nickname').value = studentId;

            const { data, error } = await myApp.from('user_errors').select('word, chinese').eq('student_id', studentId);
            
            if (!error && data) {
                const formattedErrors = data.map(d => ({ word: d.word, chinese: d.chinese }));
                localStorage.setItem('wrongWords', JSON.stringify(formattedErrors));

                const content = document.getElementById('error-list-content');
                content.innerHTML = '';
                const unique = Array.from(new Set(data.map(a => JSON.stringify(a)))).map(a => JSON.parse(a));
                
                if (unique.length > 0) {
                    unique.forEach(d => {
                        const item = document.createElement('div');
                        item.className = "text-[11px] p-2 bg-white rounded-xl border border-red-100 shadow-sm text-center";
                        item.innerHTML = `<b class="text-red-600 block mb-1">${d.word}</b><span class="text-black font-medium">${d.chinese}</span>`;
                        content.appendChild(item);
                    });
                    document.getElementById('personal-error-container').classList.remove('hidden');
                } else {
                    document.getElementById('personal-error-container').classList.add('hidden');
                }
            }
            document.getElementById('login-btn').textContent = "刷新紀錄成功";
            showScreen('level-selection');
        }

        async function selectLevel(level) {
            if (!studentId) return myAlert("請先完成登入");
            isWordKingMode = false;
            const { data } = await myApp.from('words').select('*').eq('level', level);
            allWords = data;
            document.getElementById('welcome-msg').textContent = `準備好挑戰了嗎？`;
            showScreen('quiz-selection');
        }

        async function startWordKingMode() {
            if (!studentId) return myAlert("參與單字王比賽前請先完成上方學生登入！");
            isWordKingMode = true;
            isReviewingErrors = false;

            const [elemRes, junRes, senRes] = await Promise.all([
                myApp.from('words').select('*').eq('level', 'elementary'),
                myApp.from('words').select('*').eq('level', 'junior'),
                myApp.from('words').select('*').eq('level', 'senior')
            ]);

            if (elemRes.error || junRes.error || senRes.error) {
                return myAlert("無法讀取資料庫單字，請稍後再試！");
            }

            const elemWords = elemRes.data || [];
            const junWords = junRes.data || [];
            const senWords = senRes.data || [];

            if (elemWords.length < 10 || junWords.length < 10 || senWords.length < 6) {
                return myAlert("各級距資料庫單字數量不足！");
            }

            const pickedElem = [...elemWords].sort(() => 0.5 - Math.random()).slice(0, 10);
            const pickedJun = [...junWords].sort(() => 0.5 - Math.random()).slice(0, 10);
            const pickedSen = [...senWords].sort(() => 0.5 - Math.random()).slice(0, 5);

            shuffledVocabulary = [...pickedElem, ...pickedJun, ...pickedSen];
            allWords = [...elemWords, ...junWords, ...senWords];

            currentQuizType = 'eng-to-chi';
            currentQuestionIndex = 0;
            score = 0;
            wkCorrectCount = 0;
            document.getElementById('score').textContent = score;

            document.getElementById('wordking-timer-badge').classList.remove('hidden');
            showScreen('quiz-screen');

            wkStartTime = Date.now();
            if (wkTimerInterval) clearInterval(wkTimerInterval);
            wkTimerInterval = setInterval(() => {
                wkElapsedSeconds = ((Date.now() - wkStartTime) / 1000).toFixed(1);
                document.getElementById('timer-display').textContent = wkElapsedSeconds;
            }, 100);

            loadNextQuestion();
        }

        function startQuiz(type) {
            isWordKingMode = false;
            isReviewingErrors = false;
            shuffledVocabulary = [...allWords].sort(() => 0.5 - Math.random()).slice(0, 10);
            initQuizUI(type);
        }

        async function startErrorQuiz() {
            isWordKingMode = false;
            const { data } = await myApp.from('user_errors').select('word, chinese').eq('student_id', studentId);
            if (!data || data.length === 0) return myAlert("目前沒有錯題紀錄！");

            const unique = [];
            const seen = new Set();
            data.forEach(d => {
                if(!seen.has(d.word)) {
                    seen.add(d.word);
                    unique.push({ english: d.word, chinese: d.chinese });
                }
            });

            isReviewingErrors = true;
            shuffledVocabulary = unique.sort(() => 0.5 - Math.random());
            initQuizUI('eng-to-chi');
        }

        function initQuizUI(type) {
            currentQuizType = type;
            currentQuestionIndex = 0; score = 0;
            document.getElementById('score').textContent = score;
            document.getElementById('wordking-timer-badge').classList.add('hidden');
            showScreen('quiz-screen');
            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (currentQuestionIndex >= shuffledVocabulary.length) {
                if (isWordKingMode) {
                    endWordKingMode();
                } else {
                    showResult();
                }
                return;
            }

            isAnswering = false;
            const current = shuffledVocabulary[currentQuestionIndex];
            const questionVal = currentQuizType === 'eng-to-chi' ? (current.english || current.word) : current.chinese;
            
            document.getElementById('question-text').textContent = questionVal;
            
            if (isWordKingMode) {
                document.getElementById('wordking-progress').textContent = `單字王挑戰進度：第 ${currentQuestionIndex + 1} / 25 題`;
            } else {
                document.getElementById('wordking-progress').textContent = `第 ${currentQuestionIndex + 1} / ${shuffledVocabulary.length} 題`;
            }

            if (document.getElementById('auto-voice').checked) setTimeout(() => speakWord(), 100);

            let distractors = allWords.filter(w => (w.english || w.word) !== (current.english || current.word)).sort(() => 0.5 - Math.random()).slice(0, 3);
            let options = [...distractors, { english: current.english || current.word, chinese: current.chinese, word: current.word }].sort(() => 0.5 - Math.random());
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full py-2.5 px-4 text-center bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold transition-all text-black hover:bg-slate-100 text-2xl break-words leading-tight shadow-sm active:scale-95";
                btn.textContent = currentQuizType === 'eng-to-chi' ? opt.chinese : (opt.english || opt.word);
                btn.onclick = () => handleAnswer(opt, btn, current);
                container.appendChild(btn);
            });
        }

        async function handleAnswer(selected, btn, correct) {
            if (isAnswering) return;
            isAnswering = true;
            const correctEng = correct.english || correct.word;
            const selectedEng = selected.english || selected.word;
            const isCorrect = selectedEng === correctEng;

            if (isWordKingMode) {
                if (isCorrect) {
                    btn.classList.add('option-correct');
                    score += 100;
                    wkCorrectCount++;
                } else {
                    btn.classList.add('option-wrong');
                    document.querySelectorAll('#options-container button').forEach(b => {
                        const correctText = currentQuizType === 'eng-to-chi' ? correct.chinese : correctEng;
                        if (b.textContent === correctText) b.classList.add('option-correct');
                    });
                }
            } else {
                if (isCorrect) {
                    btn.classList.add('option-correct');
                    score += 10;
                    let localWrong = JSON.parse(localStorage.getItem('wrongWords') || '[]');
                    localWrong = localWrong.filter(item => item.word !== correctEng);
                    localStorage.setItem('wrongWords', JSON.stringify(localWrong));
                    await myApp.from('user_errors').delete().eq('student_id', studentId).eq('word', correctEng);
                } else {
                    btn.classList.add('option-wrong');
                    await myApp.from('user_errors').insert([{ student_id: studentId, word: correctEng, chinese: correct.chinese }]);
                    let localWrong = JSON.parse(localStorage.getItem('wrongWords') || '[]');
                    if(!localWrong.some(i => i.word === correctEng)) {
                        localWrong.push({ word: correctEng, chinese: correct.chinese });
                        localStorage.setItem('wrongWords', JSON.stringify(localWrong));
                    }
                    document.querySelectorAll('#options-container button').forEach(b => {
                        const correctText = currentQuizType === 'eng-to-chi' ? correct.chinese : correctEng;
                        if (b.textContent === correctText) b.classList.add('option-correct');
                    });
                }
            }

            setTimeout(() => { 
                document.getElementById('score').textContent = score;
                currentQuestionIndex++; 
                loadNextQuestion(); 
            }, 700);
        }

        function endWordKingMode() {
            clearInterval(wkTimerInterval);
            if (window.speechSynthesis) window.speechSynthesis.cancel();

            wkElapsedSeconds = ((Date.now() - wkStartTime) / 1000).toFixed(1);
            
            const finalCalculatedScore = Math.round((wkCorrectCount * 1000) - (parseFloat(wkElapsedSeconds) * 10));

            document.getElementById('wk-correct-count').textContent = wkCorrectCount;
            document.getElementById('wk-time').textContent = wkElapsedSeconds;
            document.getElementById('wk-final-score').textContent = finalCalculatedScore > 0 ? finalCalculatedScore : 0;

            document.getElementById('wk-submit-box').style.display = 'block';
            showScreen('wordking-result-screen');
            fetchLeaderboard();
        }

        async function submitWordKingScore() {
            const nickname = document.getElementById('wk-nickname').value.trim();
            const finalScore = parseInt(document.getElementById('wk-final-score').textContent);

            if (!nickname) return myAlert("請輸入您的英雄榜顯示名稱！");

            const { error } = await myApp.from('word_king_leaderboard').insert([{ name: nickname, score: finalScore }]);
            if (error) {
                console.error(error);
                myAlert("上傳失敗，請確認是否已在 Supabase 建立 word_king_leaderboard 資料表");
            } else {
                myAlert("成績成功送出並更新排行榜！");
                fetchLeaderboard();
            }
        }

        async function fetchLeaderboard() {
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = '<li class="text-center text-slate-400 py-2">載入排行榜中...</li>';

            const { data, error } = await myApp.from('word_king_leaderboard').select('*').order('score', { ascending: false }).limit(10);
            if (error || !data) {
                listEl.innerHTML = '<li class="text-center text-red-400 py-2">讀取排行榜失敗 (請檢查資料表)</li>';
                return;
            }

            if (data.length === 0) {
                listEl.innerHTML = '<li class="text-center text-slate-400 py-2">目前尚無單字王競賽紀錄</li>';
                return;
            }

            listEl.innerHTML = '';
            data.forEach((row, idx) => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center px-3 py-1.5 bg-slate-800 rounded-lg";
                li.innerHTML = `<span><b>#${idx+1}</b> ${escapeHtml(row.name)}</span><span class="text-amber-400 font-bold">${row.score} 分</span>`;
                listEl.appendChild(li);
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function confirmExit() { if (confirm("結束測驗並回到首頁？")) { if(wkTimerInterval) clearInterval(wkTimerInterval); showScreen('level-selection'); } }
        function showResult() { document.getElementById('final-score').textContent = score; showScreen('result-screen'); }
        
        function speakWord() {
            const word = shuffledVocabulary[currentQuestionIndex]?.english || shuffledVocabulary[currentQuestionIndex]?.word;
            if (word) {
                const msg = new SpeechSynthesisUtterance(word);
                msg.lang = 'en-US';
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(msg);
            }
        }
        function showScreen(id) {
            ['level-selection', 'quiz-selection', 'quiz-screen', 'result-screen', 'wordking-result-screen'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
        function backToHome() { window.location.href = 'index.html'; }
    </script>
</body>
</html>
